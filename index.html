<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ApexPrep Academy — ESL, IELTS &amp; SAT Resource Bank</title>
<meta name="description" content="A modern, self-contained resource platform for ESL (B1/B2), IELTS Academic/General, and SAT Reading & Writing + Math prep, with interactive mock exams and instant scoring." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: ['selector', '[data-theme="dark"]'] };</script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen">

<div id="app-root">

  <header class="sticky top-0 z-20 backdrop-blur bg-[color:var(--paper)]/90 border-b border-[color:var(--line)]">
    <div class="mx-auto max-w-7xl px-4 md:px-6">
      <div class="flex items-center justify-between flex-wrap gap-3 min-h-16 py-2">
        <div class="flex items-center gap-3">
          <div class="brand-mark">AP</div>
          <div>
            <div class="font-serif-academic font-bold text-lg leading-none text-[color:var(--heading)]">ApexPrep Academy</div>
            <div class="text-[11px] text-[color:var(--muted)] tracking-wide">ESL &middot; IELTS &middot; SAT Resource Bank</div>
          </div>
        </div>

        <nav class="hidden lg:flex items-center gap-6" id="main-nav">
          <button class="nav-tab" data-tab="home">Home</button>
          <button class="nav-tab" data-tab="esl"><span class="tab-dot" style="background:var(--teal-700)"></span>ESL Hub</button>
          <button class="nav-tab" data-tab="ielts"><span class="tab-dot" style="background:var(--indigo-700)"></span>IELTS Suite</button>
          <button class="nav-tab" data-tab="sat"><span class="tab-dot" style="background:var(--amber-600)"></span>SAT Prep Zone</button>
          <button class="nav-tab" data-tab="progress"><span class="tab-dot" style="background:var(--green-700)"></span>My Progress</button>
        </nav>

        <div class="flex items-center gap-2 flex-wrap justify-end no-print">
          <div class="font-scale-group" title="Reading text size">
            <button id="font-scale-down" aria-label="Smaller text">A&minus;</button>
            <button id="font-scale-up" aria-label="Larger text">A+</button>
          </div>
          <button id="theme-toggle" class="icon-btn" title="Toggle dark mode">🌙</button>
          <div class="timer-pill" id="global-timer-pill"><span>⏱</span><span id="global-timer-text">No active test</span></div>
        </div>
      </div>

      <div class="flex lg:hidden gap-2 pb-3 overflow-x-auto scrollbar-thin" id="main-nav-mobile">
        <button class="nav-tab" data-tab="home">Home</button>
        <button class="nav-tab" data-tab="esl">ESL Hub</button>
        <button class="nav-tab" data-tab="ielts">IELTS Suite</button>
        <button class="nav-tab" data-tab="sat">SAT Prep Zone</button>
        <button class="nav-tab" data-tab="progress">My Progress</button>
      </div>

      <div class="flex flex-wrap items-center gap-3 pb-4 no-print">
        <input id="search-input" class="apex-input flex-1 min-w-[200px]" placeholder="Search notes, topics, mock exams..." />
        <select id="category-filter" class="apex-select hidden"></select>
      </div>
    </div>
  </header>

  <main id="main-content" class="mx-auto max-w-7xl px-4 md:px-6 py-8"></main>

  <footer class="app-footer text-center text-xs text-[color:var(--muted)] py-10">
    ApexPrep Academy &middot; a self-contained study platform for LBEnglishCo &middot; each subject's data file documents how to add the next Content Pack
  </footer>
</div>

<script src="js/store.js"></script>
<script src="js/data/esl.js"></script>
<script src="js/data/ielts.js"></script>
<script src="js/data/sat.js"></script>
<script src="js/engine.js"></script>
<script src="js/flashcards.js"></script>
<script src="js/app.js"></script>
</body>
</html>
